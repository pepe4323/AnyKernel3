name: Generate Flashable Zip

on:
  workflow_dispatch: # Spustíme ho manuálne tlačidlom

jobs:
  zip-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Large Kernel Image
        run: |
          sudo apt-get update && sudo apt-get install -y wget zip
          # Skript si stiahne váš 42.5MB súbor priamo z internetu do AnyKernel priečinka
          wget -O Image "https://github.com" || true
          
          # Ak by bol stiahnutý ako .zip, skript ho pre istotu rozbalí
          if [ -f Image.zip ]; then unzip Image.zip && rm Image.zip; fi
          if [ -f CreckerKernel-KSU-Next-S10e.zip ]; then unzip CreckerKernel-KSU-Next-S10e.zip && rm CreckerKernel-KSU-Next-S10e.zip; fi

      - name: Zip Repository Contents
        run: |
          zip -r9 CreckerKernel-KSU-Next.zip ./* -x ".git*" ".github*" README.md

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hotovy-Kernel-S10e
          path: CreckerKernel-KSU-Next.zip
