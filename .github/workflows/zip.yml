name: Generate Flashable Zip

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  zip-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Embedded Kernel
        run: |
          sudo apt-get update && sudo apt-get install -y unzip zip
          # Ak ste nahrali hotový ZIP z kompilácie, vytiahneme z neho čisté jadro Image
          if [ -f CreckerKernel-KSU-Next-S10e.zip ]; then
            unzip CreckerKernel-KSU-Next-S10e.zip "Image" || unzip CreckerKernel-KSU-Next-S10e.zip "*Image*" || true
            rm CreckerKernel-KSU-Next-S10e.zip
          fi

      - name: Zip Repository Contents
        run: |
          zip -r9 CreckerKernel-KSU-Next.zip ./* -x ".git*" ".github*" README.md

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hotovy-Kernel-S10e
          path: CreckerKernel-KSU-Next.zip
